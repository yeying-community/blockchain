# 知行图测试网 · blockchain.yeying.pub
#
# 由仓库 deploy/nginx/blockchain.conf 部署,替换旧的(已废弃的 8545/8546 代理)配置。
# TLS 在 nginx 终止;节点 RPC 与浏览器都只监听 127.0.0.1,不直接对外。
#   /rpc/  → 节点 RPC(n21,127.0.0.1:9221):读接口公开,写接口(POST)需 Bearer 令牌
#   /bodies/ → 知识正文仓库(由浏览器服务提供,127.0.0.1:8080)
#   /      → 区块浏览器(127.0.0.1:8080)

# 每个来源 IP 每秒 10 个 RPC 请求(突发 20)
limit_req_zone $binary_remote_addr zone=zhixing_rpc:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name blockchain.yeying.pub www.blockchain.yeying.pub;
    return 301 https://blockchain.yeying.pub$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.blockchain.yeying.pub;
    ssl_certificate /etc/letsencrypt/live/blockchain.yeying.pub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blockchain.yeying.pub/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://blockchain.yeying.pub$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blockchain.yeying.pub;

    ssl_certificate /etc/letsencrypt/live/blockchain.yeying.pub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blockchain.yeying.pub/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # 浏览器只从同源加载脚本与数据;页面使用了内联样式属性
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_vary on;

    # 节点 RPC 的请求体上限是 64 KiB(MAX_RPC_BODY),这里同步
    client_max_body_size 64k;

    location /rpc/ {
        proxy_pass http://127.0.0.1:9221/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Authorization(Bearer 令牌)由 nginx 默认透传给节点
        proxy_read_timeout 30s;
        # 写接口限流:防止单个来源刷写入
        limit_req zone=zhixing_rpc burst=20 nodelay;
    }

    # 知识正文仓库(内容寻址):GET 公开且永不变化;PUT 需令牌,服务端校验 sha256
    location /bodies/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        limit_req zone=zhixing_rpc burst=20 nodelay;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
