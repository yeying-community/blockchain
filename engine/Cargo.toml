[package]
name = "zhixing-engine"
version = "0.1.0"
edition = "2021"
description = "Performance-critical cognitive-graph + ΔK engine for ZhixingGraph (whitepaper §7.3)"
license = "MIT"

[lib]
name = "zhixing_engine"
# rlib for the bench binary; cdylib for the Python extension module.
crate-type = ["cdylib", "rlib"]

# pyo3 is optional and lives behind the `python` feature, so the zero-dependency
# `bench` binary still builds offline with `cargo build --release`.
[features]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }

[[bin]]
name = "bench"
path = "src/bench.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
