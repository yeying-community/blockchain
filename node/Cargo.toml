[package]
name = "zhixing-node"
version = "0.1.0"
edition = "2021"
description = "Reference PoK consensus node for ZhixingGraph: a deterministic state machine over the ΔK engine"
license = "MIT"

[lib]
name = "zhixing_node"
path = "src/lib.rs"

[[bin]]
name = "node"
path = "src/main.rs"

# The engine is reused as a plain rlib (no `python` feature, no pyo3). The node
# is an *application*, so it takes an audited crypto dependency for signatures
# (hand-rolling ed25519 would be irresponsible); the engine itself stays zero-dep.
#
# M32 adds three application-level dependencies for the real networked daemon
# (`node run`): an async runtime (tokio) for the TCP P2P transport, and
# serde+toml for file-based node/genesis/keystore config. The consensus core
# (lib.rs) stays serde-free — config.rs holds serde *mirror* structs that
# convert into the plain engine types.
#
# M37 adds structured logging for the daemon: the `tracing` facade plus a
# `tracing-subscriber` fmt subscriber (RUST_LOG-filtered). Node-crate only —
# the engine remains zero-dep. M44 makes it config-driven via a `[logging]`
# section (level + text/json format); the JSON formatter needs the subscriber's
# `json` feature (a feature flag on the existing dep, not a new crate). M45 adds
# an opt-in rolling-file target (`[logging] file` + `rotation`) via the small
# `tracing-appender` crate — still node-crate only, engine stays zero-dep.
#
# M40 promotes `getrandom` to a direct dependency (already in the lock tree via
# ed25519-dalek) for the per-session nonce in the authenticated peer handshake.
#
# M41 adds opt-in TLS 1.3 transport encryption for the P2P link: tokio-rustls
# (the tokio adapter for rustls) + rcgen for the ephemeral self-signed cert. Both
# are pinned to the `ring` crypto backend (not the default aws-lc-rs) to avoid a
# cmake/NASM C-toolchain build dependency. Node-crate only; engine stays zero-dep.
[dependencies]
zhixing-engine = { path = "../engine" }
ed25519-dalek = "2"
getrandom = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

[profile.release]
lto = true
codegen-units = 1
